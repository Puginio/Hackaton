name: Compilar APK PuestoYa
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
        working-directory: puestoya_app
      - run: flutter build apk --release
        working-directory: puestoya_app
      - uses: actions/upload-artifact@v4
        with:
          name: puestoya-apk
          path: puestoya_app/build/app/outputs/flutter-apk/app-release.apk
